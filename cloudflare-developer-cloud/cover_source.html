<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1600px;height:2560px;overflow:hidden;background:#0d1726;}
  .page{position:relative;width:1600px;height:2560px;
    background:radial-gradient(ellipse 1200px 1100px at 800px 1620px,#16304a 0%,#0f2034 45%,#0b1522 100%);
    font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#eef3f8;}
  svg{position:absolute;left:0;top:0}
  .rule{position:absolute;left:150px;top:200px;width:120px;height:8px;background:#7fd3c6;border-radius:4px}
  .title{position:absolute;left:150px;top:270px;right:120px;font-weight:800;letter-spacing:-4px;line-height:1.12;font-size:168px;color:#ffffff}
  .sub{position:absolute;left:154px;top:720px;right:140px;font-size:56px;font-weight:500;line-height:1.45;color:#a9c4d9;letter-spacing:-1px}
  .author{position:absolute;left:0;right:0;bottom:170px;text-align:center;font-size:58px;font-weight:600;letter-spacing:6px;color:#e9eef3}
  .authrule{position:absolute;left:740px;width:120px;bottom:268px;height:3px;background:#46607a}
</style></head>
<body><div class="page">
<svg id="art" width="1600" height="2560" viewBox="0 0 1600 2560" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="rule"></div>
<div class="title"><div>Cloudflare를</div><div>나의 클라우드로</div></div>
<div class="sub">정적 사이트부터 Spring 백엔드까지,<br>무료로 시작해 안전하게 운영하기</div>
<div class="authrule"></div>
<div class="author">Toby-AI</div>
</div>
<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById('art');
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
let s=7;function rnd(){s=(s*16807)%2147483647;return (s-1)/2147483646;}
const cx=800, cy=1620, R=640;
// globe wireframe: the global edge network
el('circle',{cx,cy,r:R,fill:'none',stroke:'#2a4a66','stroke-width':2,opacity:0.8});
for(let k=-2;k<=2;k++){
  if(k===0){el('line',{x1:cx,y1:cy-R,x2:cx,y2:cy+R,stroke:'#22405a','stroke-width':2});continue;}
  el('ellipse',{cx,cy,rx:Math.abs(R*Math.sin(k*Math.PI/6)),ry:R,fill:'none',stroke:'#22405a','stroke-width':2});
}
for(let k=-2;k<=2;k++){
  const y=cy+R*Math.sin(k*Math.PI/6), rx=R*Math.cos(k*Math.PI/6);
  el('ellipse',{cx,cy:y,rx,ry:rx*0.12,fill:'none',stroke:'#22405a','stroke-width':2});
}
// edge nodes on the sphere surface
const nodes=[];
for(let i=0;i<46;i++){
  const th=rnd()*Math.PI*2, ph=Math.acos(2*rnd()-1);
  const x=Math.sin(ph)*Math.cos(th), y=Math.cos(ph), z=Math.sin(ph)*Math.sin(th);
  if(z<-0.15) continue;
  nodes.push({x:cx+R*x, y:cy+R*y*0.98, z});
}
for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
  const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);
  if(d<230) el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#4f8fb0','stroke-width':2,opacity:0.35+0.3*Math.min(a.z,b.z)});
}
// layered protection rings around the core
for(const g of [{r:330,o:0.10,w:3},{r:250,o:0.16,w:3},{r:175,o:0.26,w:4}]){
  el('circle',{cx,cy,r:g.r,fill:'#7fd3c6','fill-opacity':g.o*0.35,stroke:'#7fd3c6','stroke-width':g.w,'stroke-opacity':0.25+g.o*2});
}
nodes.filter(n=>n.z>0.45).slice(0,7).forEach(n=>{
  el('line',{x1:cx,y1:cy,x2:n.x,y2:n.y,stroke:'#7fd3c6','stroke-width':2,opacity:0.35,'stroke-dasharray':'6 10'});
});
for(const n of nodes){
  const r=5+7*Math.max(0,n.z);
  el('circle',{cx:n.x,cy:n.y,r:r*2.4,fill:'#7fd3c6',opacity:0.10});
  el('circle',{cx:n.x,cy:n.y,r,fill:'#cfeee8',opacity:0.55+0.45*Math.max(0,n.z)});
}
// core: the developer's own service, nested blocks (small site growing into a full service)
el('rect',{x:cx-62,y:cy-62,width:124,height:124,rx:18,fill:'#f2c66d'});
el('rect',{x:cx-44,y:cy-44,width:88,height:88,rx:12,fill:'#0f2034'});
el('rect',{x:cx-24,y:cy-24,width:48,height:48,rx:8,fill:'#f2c66d'});
</script>
</body></html>
